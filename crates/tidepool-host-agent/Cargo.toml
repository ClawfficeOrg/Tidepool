[package]
name = "tidepool-host-agent"
version = "0.1.0"
edition = "2024"
description = "Minimal reference host agent for the Tidepool host protocol"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
# The end-to-end test runs the real pool server in-process.
tidepool = { path = "../.." }
actix-web = "4"
sqlx = { version = "0.8", features = ["mysql", "runtime-tokio-rustls", "macros", "chrono", "uuid", "json", "migrate"] }
uuid = { version = "1", features = ["v4"] }
