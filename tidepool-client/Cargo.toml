[package]
name = "tidepool-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Tidepool's reference client: a menu-bar and taskbar app generated from the Zoid tray template"
repository = "https://github.com/ClawfficeOrg/Tidepool"
keywords = ["tidepool", "clawffice", "tray", "menu-bar", "gpui"]
categories = ["gui"]

[dependencies]
gpui-kit = { version = "0.6", features = ["component", "assets"] }
gpui = { package = "gpui-pre", version = "0.3" }
signal-hook = "0.3"
directories = "6"
zoid-gpui = { path = "vendor/zoid-gpui" }
zoid-core = { path = "vendor/zoid-core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# `NSData` is needed to hand the embedded PNG bytes to `NSImage::initWithData`;
# `NSImage`/`NSColor`/`NSButton` for the menubar icon and its state tint.
objc2-foundation = { version = "0.3", features = ["NSData"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSColor", "NSButton", "NSStatusBarButton"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
] }

[dev-dependencies]
gpui-kit = { version = "0.6", features = ["test-support"] }
gpui = { package = "gpui-pre", version = "0.3", features = ["test-support"] }
# The tray-icon tests decode the shipped assets and prove they are the design
# system's cell sprite at menu-bar size, not a placeholder or a blurry scale.
png = "0.17"

# macOS: set LSUIElement = true in your app bundle's Info.plist to hide the
# Dock icon. The runtime activation-policy call in main.rs handles the same
# effect when running outside a bundle (e.g. `cargo run`).

# This project is nested inside the Tidepool repository but is its own
# workspace. Declaring it keeps the pool's root `cargo test` from pulling a
# GPUI app into the server gate, and keeps the client's package name
# (`tidepool-client`) from colliding with the Rust SDK crate of the same name
# under `sdk/rust`.
[workspace]
resolver = "3"
