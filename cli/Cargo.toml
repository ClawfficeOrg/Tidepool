[package]
name = "tidepool-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The tidepool command line: a thin client over the Rust SDK"
license = "MIT"
repository = "https://github.com/ClawfficeOrg/Tidepool"
keywords = ["tidepool", "clawffice", "cli", "automation"]
categories = ["command-line-utilities"]

[[bin]]
name = "tidepool"
path = "src/main.rs"

[lib]
name = "tidepool_cli"
path = "src/lib.rs"

[dependencies]
tidepool-client = { path = "../sdk/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
