# Tidepool control plane (the Svelte operator UI) behind Traefik, with
# Authentik forward-auth on its router only. The pool's own router in
# docker-compose.vps.yml is unchanged and stays unauthenticated at the proxy;
# operators still sign in to the pool with its own JWT.
#
# Run alongside the pool stack:
#   docker compose -f deploy/docker-compose.vps.yml -f deploy/docker-compose.controlplane.yml up -d --build controlplane
#
# Set in the VPS .env (not committed):
#   CONTROL_PLANE_HOSTNAME  the hostname the UI is served on, e.g. tidepool-control.example.com
#   TIDEPOOL_CORS_ORIGINS   must be https://${CONTROL_PLANE_HOSTNAME} (exact origin, no slash)
#   TIDEPOOL_PROXY_NETWORK  the network Traefik watches
#   TRAEFIK_ENTRYPOINT / TRAEFIK_CERTRESOLVER as already set for the pool

services:
  controlplane:
    build:
      context: .
      dockerfile: tidepool-control-plane/Dockerfile
      args:
        # The pool's public origin, so the app knows where to sign in.
        VITE_POOL_URL: "${TIDEPOOL_PUBLIC_ORIGIN:-}"
    image: tidepool-control-plane:local
    restart: unless-stopped
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TIDEPOOL_PROXY_NETWORK:-proxy-public}"
      traefik.http.routers.tidepool-control.rule: "Host(`${CONTROL_PLANE_HOSTNAME:?set CONTROL_PLANE_HOSTNAME}`)"
      traefik.http.routers.tidepool-control.entrypoints: "${TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.tidepool-control.tls: "true"
      traefik.http.routers.tidepool-control.tls.certresolver: "${TRAEFIK_CERTRESOLVER:-le}"
      traefik.http.routers.tidepool-control.middlewares: "authentik-forwardauth@file"
      traefik.http.services.tidepool-control.loadbalancer.server.port: "80"
      traefik.http.services.tidepool-control.loadbalancer.server.scheme: "http"

networks:
  proxy:
    external: true
    name: ${TIDEPOOL_PROXY_NETWORK:-proxy-public}
